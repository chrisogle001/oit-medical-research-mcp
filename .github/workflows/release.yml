name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run release:verify-tag
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke:protocol
      - run: npm run cf-typegen:check
      - run: npm run check:cloudflare
      - run: npm run check:cloudflare:production
      - run: npm run check:cloudflare:staging
      - name: Publish to npm with trusted publishing
        if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
        run: npm publish
      - name: Build release archive
        shell: bash
        run: |
          mkdir release
          npm pack --pack-destination release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "${GITHUB_REF_NAME}" release/*.tgz --generate-notes --verify-tag --title "${GITHUB_REF_NAME}"
